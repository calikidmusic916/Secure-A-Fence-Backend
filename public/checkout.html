<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure-A-Fence - Stripe Payment Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .checkout-card {
      background: #1e293b;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      color: #38bdf8;
      margin-top: 0;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }
    #payment-element {
      margin-bottom: 24px;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1d4ed8;
    }
    button:disabled {
      background-color: #475569;
      cursor: not-allowed;
    }
    #payment-message {
      color: #ef4444;
      font-size: 14px;
      margin-top: 16px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #fff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="checkout-card">
    <h1>💳 Secure-A-Fence Payment Portal</h1>
    <p>Complete your temporary fence equipment payment securely using Stripe Payment Element.</p>

    <form id="payment-form">
      <div id="payment-element">
        <!-- Stripe Payment Element mounts here -->
      </div>
      <button id="submit">
        <span id="button-text">Pay Now</span>
        <span id="spinner" class="spinner" style="display:none;"></span>
      </button>
      <div id="payment-message" style="display:none;"></div>
    </form>
  </div>

  <script>
    const stripe = Stripe('pk_test_51UGs9qERCsfh1i1Di6n7HvRCVbVwdt3Rh6CSGln2eVjUGCwSdXmRY3Af88zHFm5KOPKY7Smi1ZRZD16vmjKZWvhZ00fL302Or4');

    let elements;

    initialize();

    async function initialize() {
      try {
        const response = await fetch('/api/payments/create-intent', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ amountCents: 15000, description: 'Secure-A-Fence Web Payment' })
        });
        const { clientSecret } = await response.json();

        const appearance = { theme: 'night', labels: 'floating' };
        elements = stripe.elements({ appearance, clientSecret });

        const paymentElementOptions = { layout: 'tabs' };
        const paymentElement = elements.create('payment', paymentElementOptions);
        paymentElement.mount('#payment-element');
      } catch (e) {
        showMessage("Unable to load Stripe Payment Element: " + e.message);
      }
    }

    document.querySelector('#payment-form').addEventListener('submit', handleSubmit);

    async function handleSubmit(e) {
      e.preventDefault();
      setLoading(true);

      const { error } = await stripe.confirmPayment({
        elements,
        confirmParams: {
          return_url: window.location.origin + '/completion.html',
        },
      });

      if (error && (error.type === "card_error" || error.type === "validation_error")) {
        showMessage(error.message);
      } else if (error) {
        showMessage("An unexpected error occurred.");
      }

      setLoading(false);
    }

    function showMessage(messageText) {
      const messageContainer = document.querySelector("#payment-message");
      messageContainer.style.display = "block";
      messageContainer.textContent = messageText;

      setTimeout(function () {
        messageContainer.style.display = "none";
        messageContainer.textContent = "";
      }, 5000);
    }

    function setLoading(isLoading) {
      if (isLoading) {
        document.querySelector("#submit").disabled = true;
        document.querySelector("#spinner").style.display = "inline-block";
        document.querySelector("#button-text").style.display = "none";
      } else {
        document.querySelector("#submit").disabled = false;
        document.querySelector("#spinner").style.display = "none";
        document.querySelector("#button-text").style.display = "inline";
      }
    }
  </script>
</body>
</html>
